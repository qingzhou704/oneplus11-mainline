# systemd-networkd only runs the point-to-point USB gadget link
# (RequiredForOnline=no), leaving networkd's overall OnlineState as unknown.
# Upstream internet is managed by NetworkManager; avoid apt-helper calling
# systemd-networkd-wait-online and timing out for 30s on every timer run.
[Service]
ExecStartPre=
ExecStartPre=-/usr/bin/nm-online -q --timeout=30
