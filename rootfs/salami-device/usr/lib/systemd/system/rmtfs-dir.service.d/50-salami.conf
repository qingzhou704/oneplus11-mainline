# The modem reads and writes copies of its EFS in /var/lib/rmtfs (made by
# salami-import-modem-data); the modemst1/modemst2/fsg/fsc partitions are never written.
# Kernels without the modem (no rmtfs memory region) skip the service.
[Unit]
ConditionPathExists=/dev/qcom_rmtfs_mem1
After=salami-import-modem-data.service
