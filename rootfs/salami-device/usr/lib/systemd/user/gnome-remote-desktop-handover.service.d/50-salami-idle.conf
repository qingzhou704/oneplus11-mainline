# Only remote-login sessions use the handover daemon. Keep their virtual
# display active without changing the physical desktop's screen-blanking setting.
[Unit]
After=gnome-session-manager.target

[Service]
ExecStart=
ExecStart=/usr/bin/gnome-session-inhibit --app-id=org.gnome.RemoteDesktop --reason=Remote-desktop-session --inhibit=idle /usr/libexec/gnome-remote-desktop-daemon --handover
