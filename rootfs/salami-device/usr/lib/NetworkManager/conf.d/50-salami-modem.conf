# Qualcomm IPA rmnet_ipa0 has max MTU 1500, and qmapmux0.0 reserves a 4-byte
# QMAP header (rmnet_vnd_change_mtu caps new_mtu at 1496). Carriers advertise
# MTU 1500 on the bearer, which otherwise makes NetworkManager fail with EINVAL
# and retry every 30s whenever a GSM profile leaves gsm.mtu at default (auto).
[connection-salami-qmap-mtu]
match-device=interface-name:qrtr*
gsm.mtu=1496
