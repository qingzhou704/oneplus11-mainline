# Probe upstream WAN reachability every 60s via a fast domestic HTTP 204 endpoint.
# When an associated Wi-Fi hotspot loses WAN, NetworkManager adds +20000 to its
# route metric (600 -> 20600 > cellular 900), automatically failing over traffic
# (including cloudflared / SSH) to 5G qmapmux0.0 and restoring Wi-Fi on recovery.
[connectivity]
uri=http://connectivitycheck.platform.hicloud.com/generate_204
response=
interval=60
