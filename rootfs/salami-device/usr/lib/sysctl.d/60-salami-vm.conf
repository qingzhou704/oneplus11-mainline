# Tune VM swapping and watermarks for 8 GiB zstd ZRAM: single-page swap I/O
# (page-cluster=0) minimizes latency and watermark_boost_factor=0 avoids
# premature kswapd direct-reclaim stalls under THP.
vm.swappiness = 60
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
