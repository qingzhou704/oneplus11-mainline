# Kernel exploit-surface and network security hardening for OnePlus 11 (salami).
# Loaded automatically by systemd-sysctl at boot and on salami-device upgrade.

# Protect /tmp and world-writable sticky directories against TOCTOU symlink,
# hardlink, FIFO, and regular-file overwrite privilege escalation attacks.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 1
fs.protected_regular = 2
fs.suid_dumpable = 0

# Restrict KASLR kernel pointer exposure, dmesg scraping, legacy TTY line-discipline
# module autoloading, NULL-page mappings, unprivileged userfaultfd race-Pause
# primitives, and harden ARM64 eBPF JIT with constant blinding.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.unprivileged_bpf_disabled = 2
net.core.bpf_jit_harden = 2
-dev.tty.ldisc_autoload = 0
-vm.unprivileged_userfaultfd = 0
vm.mmap_min_addr = 65536

# Block ICMP / ICMPv6 rogue route redirects, source-routed packet spoofing,
# and TCP TIME-WAIT assassination (RFC 1337).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv4.tcp_rfc1337 = 1
net.ipv4.tcp_syncookies = 1
