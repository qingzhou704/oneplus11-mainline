# OnePlus 11 (salami): let the ADSP run SUPERVOOC on the original charger.
# The driver only acts on boards whose DT carries the USB connector NTCs and
# still refuses anything but a DCP; without this the stock charger stays a
# 5 V/1 A source and the two-cell pack charges at about 3 W.
options qcom_battmgr vooc=1
